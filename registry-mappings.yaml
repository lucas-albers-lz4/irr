# IRR Configuration File
#
# Registry mappings redirect container image pulls from public registries
# to your private registry. Update the 'target' values to match your setup.
#
# Create this file from a chart with:
#   irr inspect --chart-path ./my-chart --generate-config-skeleton
#
# Edit entries with:
#   irr config --source <registry> --target <path>
#
# This file is a template. 'irr override' and 'irr validate' can run without
# it, but image redirection correctness depends on your configuration.

registries:
  mappings:
    - source: docker.io
      target: my-registry.example.com/docker-mirror
      description: Example mapping; replace with your registry
      enabled: true
  defaultTarget: my-registry.example.com
version: "1.0"
compatibility:
  ignoreEmptyFields: true
